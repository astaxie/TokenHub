version: 2

project_name: tokenhub

builds:
  - id: tokenhub
    dir: backend
    main: ./cmd/tokenhub
    binary: tokenhub
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
    env:
      - CGO_ENABLED=1
      - >-
        {{- if and (eq .Os "linux") (eq .Arch "amd64") }}CC=zig cc -target x86_64-linux-musl{{- end }}
        {{- if and (eq .Os "linux") (eq .Arch "arm64") }}CC=zig cc -target aarch64-linux-musl{{- end }}
        {{- if and (eq .Os "windows") (eq .Arch "amd64") }}CC=zig cc -target x86_64-windows-gnu{{- end }}
    targets:
      - linux_amd64_v1
      - linux_arm64_v8.0
      - windows_amd64_v1
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - ids:
      - tokenhub
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md
      - README.ja.md
      - src: data/model-catalog.yaml
        dst: data

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
