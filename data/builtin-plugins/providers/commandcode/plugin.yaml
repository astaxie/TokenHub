schema_version: 2
id: "tokenhub.provider-catalog.commandcode"
name: "Command Code API"
version: 1.0.0
summary: "Connect TokenHub to Command Code API."
description: "Connect TokenHub to Command Code API. Connection behavior is provided by the host-managed openai_compatible adapter."
category: provider_integration
tokenhub:
  plugin_api: v2
  min_core: 0.7.0
host_adapter: "openai_compatible"
distribution:
  license: Apache-2.0
kinds:
  - provider
placement: []
capabilities:
  provider_types:
    - "openai_compatible"
  provider:
    default_base_url: "https://api.commandcode.ai/provider/v1"
    catalog:
      id: "commandcode"
      name: "Command Code API"
      display_name: "Command Code API"
      type: "openai_compatible"
      base_url: "https://api.commandcode.ai/provider/v1"
      doc_url: "https://commandcode.ai/docs/provider"
      categories: []
      models_count: 0
permissions:
  network:
    allow: []
  data:
    read: []
    write: []
