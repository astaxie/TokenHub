schema_version: 2
id: "tokenhub.provider-catalog.nous"
name: "Nous Portal API"
version: 1.0.0
summary: "Connect TokenHub to Nous Portal API."
description: "Connect TokenHub to Nous Portal API. Connection behavior is provided by the host-managed openai_compatible adapter."
category: provider_integration
tokenhub:
  plugin_api: v2
  min_core: 0.7.0
host_adapter: "openai_compatible"
distribution:
  license: Apache-2.0
kinds:
  - provider
placement: []
capabilities:
  provider_types:
    - "openai_compatible"
  provider:
    default_base_url: "https://inference-api.nousresearch.com/v1"
    catalog:
      id: "nous"
      name: "Nous Portal API"
      display_name: "Nous Portal API"
      type: "openai_compatible"
      base_url: "https://inference-api.nousresearch.com/v1"
      doc_url: "https://portal.nousresearch.com"
      categories: []
      models_count: 0
permissions:
  network:
    allow: []
  data:
    read: []
    write: []
