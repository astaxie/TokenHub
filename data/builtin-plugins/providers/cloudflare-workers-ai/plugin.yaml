schema_version: 2
id: "tokenhub.provider-catalog.cloudflare-workers-ai"
name: "Cloudflare Workers AI"
version: 1.0.0
summary: "Connect TokenHub to Cloudflare Workers AI."
description: "Connect TokenHub to Cloudflare Workers AI. Connection behavior is provided by the host-managed openai_compatible adapter."
category: provider_integration
tokenhub:
  plugin_api: v2
  min_core: 0.7.0
host_adapter: "openai_compatible"
distribution:
  license: Apache-2.0
kinds:
  - provider
placement: []
capabilities:
  provider_types:
    - "openai_compatible"
  provider:
    catalog:
      id: "cloudflare-workers-ai"
      name: "Cloudflare Workers AI"
      display_name: "Cloudflare Workers AI"
      type: "openai_compatible"
      base_url: "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"
      doc_url: "https://developers.cloudflare.com/workers-ai/models/"
      categories: []
      models_count: 21
permissions:
  network:
    allow: []
  data:
    read: []
    write: []
