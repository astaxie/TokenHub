services:
  tokenhub-redis:
    container_name: tokenhub-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - tokenhub-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - tokenhub

  tokenhub-backend:
    environment:
      TOKENHUB_BILLING_REDIS_URL: ${TOKENHUB_BILLING_REDIS_URL:-redis://tokenhub-redis:6379/0}
    depends_on:
      tokenhub-redis:
        condition: service_healthy

volumes:
  tokenhub-redis-data:
    name: tokenhub-redis-data
