{{- if .Values.externalSecret.enabled }}
{{- if .Values.postgresql.enabled }}
{{- fail "externalSecret.enabled and postgresql.enabled are mutually exclusive; TOKENHUB_DATABASE_URL must come from the external secret manager." }}
{{- end }}
{{- /* secretEnv keys are always present; only explicit values conflict. */}}
{{- range $key, $value := .Values.secretEnv }}
{{- if $value }}
{{- fail (printf "externalSecret.enabled and secretEnv.%s are mutually exclusive; store the value in the external secret instead." $key) }}
{{- end }}
{{- end }}
{{- if not .Values.externalSecret.secretStore }}
{{- fail "externalSecret.secretStore is required (the ClusterSecretStore to sync from)." }}
{{- end }}
{{- if not .Values.externalSecret.sourceSecretId }}
{{- fail "externalSecret.sourceSecretId is required (the remote secret holding TOKENHUB_SECRET_KEY and TOKENHUB_DATABASE_URL)." }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "tokenhub.fullname" . }}
  labels:
    {{- include "tokenhub.labels" . | nindent 4 }}
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStore }}
  # The remote secret is extracted 1:1 into the chart credentials secret; its
  # keys must use the TOKENHUB_* names the pod environment expects.
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.sourceSecretId }}
  target:
    name: {{ include "tokenhub.secretName" . }}
    creationPolicy: Owner
{{- end }}
