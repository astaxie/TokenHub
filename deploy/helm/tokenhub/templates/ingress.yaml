{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.host is required when ingress.enabled is true (or disable the ingress and expose the service yourself)." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tokenhub.fullname" . }}
  labels:
    {{- include "tokenhub.labels" . | nindent 4 }}
  {{- $defaultAnnotations := dict
      "nginx.ingress.kubernetes.io/proxy-body-size" "32m"
      "nginx.ingress.kubernetes.io/proxy-buffering" "off"
      "nginx.ingress.kubernetes.io/proxy-request-buffering" "off"
      "nginx.ingress.kubernetes.io/proxy-read-timeout" "300"
      "nginx.ingress.kubernetes.io/proxy-send-timeout" "300"
      "nginx.ingress.kubernetes.io/backend-protocol" "HTTP" }}
  annotations:
    {{- range $key, $value := mergeOverwrite $defaultAnnotations .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range list "/api" "/v1" "/v1beta" "/docs" "/openapi.json" "/openapi.yaml" "/healthz" "/readyz" "/livez" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "tokenhub.fullname" $ }}
                port:
                  name: api
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "tokenhub.fullname" $ }}
                port:
                  name: console
{{- end }}
