apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tokenhub.fullname" . }}
  labels:
    {{- include "tokenhub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy }}
    {{- if eq .Values.strategy "RollingUpdate" }}
    rollingUpdate:
      # RollingUpdate is gated on confirmInstanceScopedRecovery: the old pod
      # keeps serving while the new one starts, which only instance-scoped
      # image-job recovery makes safe.
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  selector:
    matchLabels:
      {{- include "tokenhub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "tokenhub.podMetadata" . | nindent 6 }}
    spec:
      {{- include "tokenhub.podSpec" . | nindent 6 }}
