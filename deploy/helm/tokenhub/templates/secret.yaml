{{/*
Two chart-managed secrets, rendered independently:

- <fullname>-database holds TOKENHUB_DATABASE_URL whenever the chart knows
  the URL itself (inline database.url or composed from the bundled
  PostgreSQL) and it is not referenced from database.existingSecret or the
  External Secrets Operator. Rendering it separately lets an existing
  credentialsSecret combine with any supported database source.
- <fullname>-credentials holds the chart-managed auth values (secretEnv
  minus TOKENHUB_DATABASE_URL). With credentialsSecret an existing secret
  supplies them; with externalSecret.enabled the operator does.
*/}}

{{- if and .Values.ingress.enabled (not .Values.ingress.host) }}
{{- fail "ingress.host is required when ingress.enabled is true." }}
{{- end }}
{{- if and .Values.externalSecret.enabled .Values.postgresql.enabled }}
{{- fail "externalSecret.enabled and postgresql.enabled are mutually exclusive." }}
{{- end }}
{{- if and .Values.externalSecret.enabled .Values.database.url }}
{{- fail "externalSecret.enabled and database.url are mutually exclusive; provide TOKENHUB_DATABASE_URL through the secret manager." }}
{{- end }}
{{- if and .Values.credentialsSecret .Values.externalSecret.enabled }}
{{- fail "externalSecret.enabled manages the chart credentials secret; unset credentialsSecret." }}
{{- end }}
{{- if eq .Values.imageStorage.type "existingClaim" }}
{{- if not .Values.imageStorage.existingClaim }}
{{- fail "imageStorage.existingClaim is required when imageStorage.type is existingClaim." }}
{{- end }}
{{- end }}
{{- if not (or (eq .Values.strategy "Recreate") (eq .Values.strategy "RollingUpdate")) }}
{{- fail "strategy must be Recreate or RollingUpdate." }}
{{- end }}
{{- /* Overlapping pods and the 0.8.0 image's global startup/shutdown
recovery fail each other's image jobs: the published 0.8.0 image marks every
unfinished image job in the shared database as failed whenever any replica
starts or stops. Only images with instance-scoped recovery are safe to
overlap, and the chart cannot inspect image contents, so overlap-capable
configurations fail closed until the operator pins such a release and
confirms it. */}}
{{- if and (not .Values.confirmInstanceScopedRecovery) (or (gt (int .Values.replicaCount) 1) (eq .Values.strategy "RollingUpdate")) }}
{{- fail "overlapping pods need an image with instance-scoped image-job recovery (first shipped in a release after 0.8.0): pin image.tag to a release containing the fix and set confirmInstanceScopedRecovery=true, or keep replicaCount=1 with strategy Recreate" }}
{{- end }}

{{- /* Required inputs. */}}
{{- if not (or .Values.database.url .Values.database.existingSecret .Values.postgresql.enabled .Values.externalSecret.enabled) }}
{{- fail "no database configured: set one of database.url, database.existingSecret, postgresql.enabled, externalSecret.enabled" }}
{{- end }}

{{- /* The database URL is composed unless it comes from an existing secret or
the External Secrets Operator. */}}
{{- $databaseURL := "" }}
{{- if not (or .Values.database.existingSecret .Values.externalSecret.enabled) }}
{{- if and (not .Values.database.url) (not .Values.postgresql.enabled) }}
{{- fail "no database URL: set one of database.url, database.existingSecret, postgresql.enabled, externalSecret.enabled" }}
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.database.url) (not .Values.postgresql.auth.password) }}
{{- fail "postgresql.auth.password is required to compose the built-in database URL." }}
{{- end }}
{{- $databaseURL = include "tokenhub.databaseURL" . }}
{{- end }}

{{- /* Chart-managed credentials secret: rendered unless an existing secret
or the External Secrets Operator supplies the credential keys. */}}
{{- $renderCredentials := not (or .Values.credentialsSecret .Values.externalSecret.enabled) }}
{{- if $renderCredentials }}
{{- if not (index .Values.secretEnv "TOKENHUB_SECRET_KEY") }}
{{- fail "secretEnv.TOKENHUB_SECRET_KEY is required: set an explicit secret key (openssl rand -hex 32)" }}
{{- end }}
{{- /* The bootstrap password is never generated: it seeds the admin account
only on an empty database, so it must be an explicit stable value the operator
chooses and can retrieve later. */}}
{{- if not (index .Values.secretEnv "TOKENHUB_BOOTSTRAP_ADMIN_PASSWORD") }}
{{- fail "secretEnv.TOKENHUB_BOOTSTRAP_ADMIN_PASSWORD is required: set an explicit stable bootstrap password; it seeds the admin account only on an empty database" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tokenhub.secretName" . }}
  labels:
    {{- include "tokenhub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{- if eq $key "TOKENHUB_SECRET_KEY" }}
  TOKENHUB_SECRET_KEY: {{ required "secretEnv.TOKENHUB_SECRET_KEY is required" $value | quote }}
  {{- else if eq $key "TOKENHUB_BOOTSTRAP_ADMIN_PASSWORD" }}
  # Bootstrap password for the seeded "admin" account (prod startup rejects
  # the weak built-in default). Never generated: the operator sets a stable
  # value; seeding only runs on an empty database.
  TOKENHUB_BOOTSTRAP_ADMIN_PASSWORD: {{ required "secretEnv.TOKENHUB_BOOTSTRAP_ADMIN_PASSWORD is required" $value | quote }}
  {{- else if eq $key "TOKENHUB_DATABASE_URL" }}
  {{- /* Stored in the database secret instead. */}}
  {{- else if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}

{{- /* Chart-managed database secret: rendered whenever the chart itself
holds the database URL. */}}
{{- if and $databaseURL (not .Values.database.existingSecret) (not .Values.externalSecret.enabled) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tokenhub.databaseSecretName" . }}
  labels:
    {{- include "tokenhub.labels" . | nindent 4 }}
type: Opaque
stringData:
  TOKENHUB_DATABASE_URL: {{ $databaseURL | quote }}
{{- end }}
