resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8080;
    server_name _;

    # nginx size syntax accepts only a bare byte count or a single-letter k/m/g
    # suffix, so it uses its own variable rather than TOKENHUB_MAX_MULTIMODAL_REQUEST_BYTES
    # (which also accepts kb/mib/... forms nginx would reject). Keep this at least as
    # large as the multimodal limit so the proxy never rejects a body the backend would
    # accept. envsubst substitutes the value; the ${VAR:-default} form is not supported
    # by the nginx image's template step, so the compose file supplies the default.
    client_max_body_size ${TOKENHUB_NGINX_CLIENT_MAX_BODY_SIZE};

    location = /gateway-healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/(api|v1|healthz|readyz|livez)(/|$) {
        set $tokenhub_backend http://tokenhub-backend:8080;
        proxy_pass $tokenhub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        set $tokenhub_frontend http://tokenhub-frontend:3000;
        proxy_pass $tokenhub_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
