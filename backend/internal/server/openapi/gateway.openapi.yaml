        object:
          type: string
          const: list
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        usage:
          $ref: "#/components/schemas/Usage"
    ImageGenerationRequest:
      type: object
      required: [model, prompt]
      additionalProperties: true
      properties:
