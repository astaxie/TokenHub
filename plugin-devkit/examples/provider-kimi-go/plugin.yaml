schema_version: 2
id: tokenhub.provider.kimi-go
name: Kimi Subscription Go Provider
version: 1.0.0
summary: Connect TokenHub to a Kimi subscription account.
description: Reference Go Provider plugin using the TokenHub stdio-json-v1 transport.
category: provider_integration
tokenhub:
  plugin_api: v2
  min_core: 0.7.0
kinds:
  - provider
placement:
  - gateway_chain
entry:
  backend:
    protocol: stdio-json-v1
    command: bin/provider-kimi-go
capabilities:
  provider_types:
    - kimi_subscription
  provider_resource_types:
    - kimi_subscription_account
  provider:
    route_protocols:
      - chat/completions
      - responses
    supports_custom_headers: false
    api_key_required: true
    credentials_scope: provider
    default_base_url: https://api.moonshot.cn/v1
    error_profile: generic
    model_discovery:
      path: /models
      auth: bearer_header
  gateway:
    - chat
    - chat_stream
    - responses
    - responses_stream
    - embeddings
    - models
    - probe
permissions:
  data:
    read:
      - provider_credentials
distribution:
  repository_url: https://github.com/astaxie/TokenHub
  homepage_url: https://github.com/astaxie/TokenHub/tree/main/plugin-devkit/examples/provider-kimi-go
  license: Apache-2.0
