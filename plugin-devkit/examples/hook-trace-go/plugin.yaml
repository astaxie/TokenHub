schema_version: 2
id: tokenhub.hook.trace-go
name: Trace Go Hook
version: 1.0.0
summary: Export trace data after request processing completes.
description: Reference observe-only trace export hook using the TokenHub stdio-json-v1 transport.
category: request_pipeline
tokenhub:
  plugin_api: v2
  min_core: 0.7.0
kinds:
  - extension
placement:
  - gateway_chain
entry:
  backend:
    protocol: stdio-json-v1
    command: bin/hook-trace-go
capabilities:
  hooks:
    - id: trace.export
      stage: trace_export
      failure_policy: observe_only
      reads:
        - audit
        - usage
permissions:
  data:
    read:
      - audit
      - usage
distribution:
  repository_url: https://github.com/astaxie/TokenHub
  homepage_url: https://github.com/astaxie/TokenHub/tree/main/plugin-devkit/examples/hook-trace-go
  license: Apache-2.0
