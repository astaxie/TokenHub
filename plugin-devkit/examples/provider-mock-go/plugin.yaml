schema_version: 2
id: tokenhub.provider.mock-go
name: Mock Go Provider
version: 1.0.0
summary: Exercise the Provider contract without a real upstream service.
description: Reference Go Provider plugin using the TokenHub stdio-json-v1 transport.
category: provider_integration
tokenhub:
  plugin_api: v2
  min_core: 0.7.0
kinds:
  - provider
placement:
  - gateway_chain
entry:
  backend:
    protocol: stdio-json-v1
    command: bin/provider-mock-go
capabilities:
  provider_types:
    - external_mock
  provider_resource_types:
    - external_mock_account
  provider:
    route_protocols:
      - chat/completions
      - responses
    supports_custom_headers: false
    api_key_required: true
    credentials_scope: provider
    default_base_url: https://mock-provider.example/v1
    error_profile: generic
    model_discovery:
      path: /models
      auth: bearer_header
  gateway:
    - chat
    - chat_stream
    - responses
    - responses_stream
    - embeddings
    - models
    - probe
permissions:
  data:
    read:
      - provider_credentials
distribution:
  repository_url: https://github.com/astaxie/TokenHub
  homepage_url: https://github.com/astaxie/TokenHub/tree/main/plugin-devkit/examples/provider-mock-go
  license: Apache-2.0
