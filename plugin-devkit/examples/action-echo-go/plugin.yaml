schema_version: 2
id: tokenhub.action.echo-go
name: Echo Go Action
version: 1.0.0
summary: Run a small operator-triggered action through TokenHub.
description: Reference management action plugin using the TokenHub stdio-json-v1 transport.
category: automation
tokenhub:
  plugin_api: v2
  min_core: 0.7.0
kinds:
  - extension
placement:
  - management_action
entry:
  backend:
    protocol: stdio-json-v1
    command: bin/action-echo-go
capabilities:
  actions:
    - id: echo.run
      kind: test
      title: Echo payload
      capability: contract.echo
      subject: action-echo-go
      input_schema:
        type: object
        required:
          - resource_id
        properties:
          resource_id:
            type: string
          message:
            type: string
          dry_run:
            type: boolean
      output_schema:
        type: object
        required:
          - resource_id
          - message
          - dry_run
          - actor_id
        properties:
          resource_id:
            type: string
          message:
            type: string
          dry_run:
            type: boolean
          actor_id:
            type: string
distribution:
  repository_url: https://github.com/astaxie/TokenHub
  homepage_url: https://github.com/astaxie/TokenHub/tree/main/plugin-devkit/examples/action-echo-go
  license: Apache-2.0
